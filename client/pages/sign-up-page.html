
<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign Up | AgriHire</title>

    <link rel="stylesheet" href="../css/style.css" />
    <script src="../js/signup.js" defer></script>
</head>

<body>
    <header class="navbar">
        <a href="../index.html" class="logo">🚜 AgriHire</a>
        <a href="login.html">Already have an account? Login</a>
    </header>

    <main class="auth-page">
        <div class="signup-card">
            <h1>Create Your AgriHire Account</h1>
            <p>Join farmers and equipment owners on AgriHire.</p>

            <form id="signupForm" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label for="firstName">First Name</label>
                        <input type="text" id="firstName" name="firstName"
                               placeholder="First name" autocomplete="given-name"
                               required />
                    </div>

                    <div class="form-group">
                        <label for="lastName">Last Name</label>
                        <input type="text" id="lastName" name="lastName"
                               placeholder="Last name" autocomplete="family-name"
                               required />
                    </div>
                </div>

                <div class="form-group">
                    <label for="mobile">Mobile Number</label>
                    <input type="tel" id="mobile" name="mobile"
                           placeholder="10-digit mobile number"
                           inputmode="numeric" pattern="[0-9]{10}"
                           maxlength="10" autocomplete="tel" required />
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email"
                           placeholder="Enter email" autocomplete="email"
                           required />
                </div>

                <div class="form-group">
                    <label for="location">Location</label>
                    <input type="text" id="location" name="location"
                           placeholder="Village / City / District"
                           autocomplete="address-level2" required />
                </div>

                <div class="form-group">
                    <label>I am a</label>

                    <div class="role-options">
                        <label>
                            <input type="checkbox" name="roles" value="farmer" />
                            👨‍🌾 Farmer
                        </label>

                        <label>
                            <input type="checkbox" name="roles" value="owner" />
                            🚜 Equipment Owner
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="language">Preferred Language</label>
                    <select id="language" name="language" required>
                        <option value="English">English</option>
                        <option value="Hindi">हिंदी</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password"
                               placeholder="Create password" minlength="8"
                               autocomplete="new-password" required />
                    </div>

                    <div class="form-group">
                        <label for="confirmPassword">Confirm Password</label>
                        <input type="password" id="confirmPassword"
                               name="confirmPassword"
                               placeholder="Confirm password"
                               minlength="8" autocomplete="new-password"
                               required />
                    </div>
                </div>

                <label class="terms">
                    <input type="checkbox" id="terms" name="terms" required />
                    I agree to the Terms &amp; Conditions.
                </label>

                <p id="signupMessage" role="status"
                   aria-live="polite"></p>

                <button type="submit" class="btn full-width">
                    Create Account
                </button>
            </form>
        </div>
    </main>
</body>
</html>
