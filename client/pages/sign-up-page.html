<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | AgriHire</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="navbar">

    <a href="../index.html" class="logo">
        🚜 AgriHire
    </a>

    <a href="login.html">
        Already have an account? Login
    </a>

</header>


<main class="auth-page">

    <div class="signup-card">

        <h1>Create Your AgriHire Account</h1>

        <p>
            Join farmers and equipment owners on AgriHire.
        </p>


        <form>

            <div class="form-row">

                <div class="form-group">

                    <label>First Name</label>

                    <input
                        type="text"
                        placeholder="First name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Last Name</label>

                    <input
                        type="text"
                        placeholder="Last name"
                        required
                    >

                </div>

            </div>


            <div class="form-group">

                <label>Mobile Number</label>

                <input
                    type="tel"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                    required
                >

            </div>


            <div class="form-group">

                <label>Email</label>

                <input
                    type="email"
                    placeholder="Enter email"
                    required
                >

            </div>


            <div class="form-group">

                <label>Location</label>

                <input
                    type="text"
                    placeholder="Village / City / District"
                    required
                >

            </div>


            <div class="form-group">

                <label>I am a</label>

                <div class="role-options">

                    <label>
                        <input
                            type="radio"
                            name="role"
                            value="farmer"
                            required
                        >
                        👨‍🌾 Farmer
                    </label>

                    <label>
                        <input
                            type="radio"
                            name="role"
                            value="owner"
                        >
                        🚜 Equipment Owner
                    </label>

                </div>

            </div>


            <div class="form-group">

                <label>Preferred Language</label>

                <select>

                    <option>English</option>

                    <option>हिंदी</option>

                </select>

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        placeholder="Create password"
                        required
                    >

                </div>


                <div class="form-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        placeholder="Confirm password"
                        required
                    >

                </div>

            </div>


            <label class="terms">

                <input type="checkbox" required>

                I agree to the Terms & Conditions.

            </label>


            <button
                type="submit"
                class="btn full-width"
            >
                Create Account
            </button>

        </form>

    </div>

</main>

</body>
</html>
