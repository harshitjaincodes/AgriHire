
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Book Equipment | AgriHire</title>

    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="navbar">
    <a href="../index.html" class="logo">🚜 AgriHire</a>
    <a href="equipment.html">← Back to Equipment</a>
</header>

<main class="booking-page">

    <h1>Book Your Equipment</h1>

    <div class="booking-layout">

        <!-- EQUIPMENT DETAILS -->
        <section class="booking-equipment">

            <img
                id="equipmentImage"
                src="../images/john-deere.jpeg"
                alt="Selected agricultural equipment"
            >

            <h2 id="equipmentName">Loading equipment...</h2>

            <p id="equipmentCategory">🚜 Equipment</p>

            <p id="equipmentLocation">📍 Loading location...</p>

            <p>⭐ 4.8 (36 Reviews)</p>

        </section>

        <!-- BOOKING FORM -->
        <section class="booking-form">

            <h2>Select Rental Plan</h2>

            <label>
                <input type="radio" name="plan" value="hourly">
                ₹<span id="hourlyRate">0</span>/hour
            </label>

            <label>
                <input type="radio" name="plan" value="daily" checked>
                ₹<span id="dailyRate">0</span>/day
            </label>

            <label>
                <input type="radio" name="plan" value="weekly">
                ₹<span id="weeklyRate">0</span>/7 days
            </label>

            <label>
                <input type="radio" name="plan" value="ten-day">
                ₹<span id="tenDayRate">0</span>/10 days
                + 10L Diesel Free
            </label>

            <div class="form-group">
                <label for="startDate">Start Date and Time</label>
                <input
                    type="datetime-local"
                    id="startDate"
                    required
                >
            </div>

            <div class="form-group">
                <label for="endDate">End Date and Time</label>
                <input
                    type="datetime-local"
                    id="endDate"
                    required
                >
            </div>

            <!-- DYNAMIC PRICE SUMMARY -->
            <div class="price-summary">

                <h3>Booking Summary</h3>

                <p>
                    Rental Price:
                    <strong id="rentalPrice">₹0</strong>
                </p>

                <p>
                    Security Deposit:
                    <strong id="securityDeposit">₹1,000</strong>
                </p>

                <hr>

                <h2>
                    Total:
                    <span id="totalPrice">₹1,000</span>
                </h2>

            </div>

            <button
                class="btn full-width"
                type="button"
                id="requestBookingBtn"
            >
                Request Booking
            </button>

            <p id="bookingMessage" role="status" aria-live="polite"></p>

        </section>

    </div>

</main>

<script src="../js/booking.js"></script>

</body>
</html>
