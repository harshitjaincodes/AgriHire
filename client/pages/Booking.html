<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Book Equipment | AgriHire</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="navbar">

    <a href="../index.html" class="logo">
        🚜 AgriHire
    </a>

    <a href="equipment.html">
        ← Back to Equipment
    </a>

</header>


<main class="booking-page">

    <h1>
        Book Your Equipment
    </h1>


    <div class="booking-layout">


        <!-- EQUIPMENT -->

        <section class="booking-equipment">

            <img
                src="../images/john-deere.jpeg"
                alt="John Deere 5310"
            >

            <h2>
                John Deere 5310
            </h2>

            <p>
                🚜 Tractor
            </p>

            <p>
                📍 Gurugram, Haryana
            </p>

            <p>
                ⭐ 4.8 (36 Reviews)
            </p>

        </section>


        <!-- BOOKING FORM -->

        <section class="booking-form">

            <h2>
                Select Rental Plan
            </h2>

            <label>

                <input
                    type="radio"
                    name="plan"
                    value="hourly"
                >

                ₹500/hour

            </label>


            <label>

                <input
                    type="radio"
                    name="plan"
                    value="daily"
                    checked
                >

                ₹2,000/day

            </label>


            <label>

                <input
                    type="radio"
                    name="plan"
                    value="weekly"
                >

                ₹12,500/7 days

            </label>


            <label>

                <input
                    type="radio"
                    name="plan"
                    value="ten-day"
                >

                ₹18,000/10 days
                + 10L Diesel Free

            </label>


            <div class="form-group">

                <label>
                    Start Date
                </label>

                <input
                    type="date"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    End Date
                </label>

                <input
                    type="date"
                    required
                >

            </div>


            <div class="price-summary">

                <h3>
                    Booking Summary
                </h3>

                <p>
                    Rental Price:
                    <strong>₹2,000</strong>
                </p>

                <p>
                    Security Deposit:
                    <strong>₹1,000</strong>
                </p>

                <hr>

                <h2>
                    Total:
                    ₹3,000
                </h2>

            </div>


            <button
                class="btn full-width"
                type="submit"
            >
                Request Booking
            </button>

        </section>

    </div>

</main>

</body>
</html>
