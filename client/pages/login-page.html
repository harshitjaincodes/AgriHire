<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | AgriHire</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="navbar">

    <a href="../index.html" class="logo">
        🚜 AgriHire
    </a>

    <div class="nav-actions">

        <button>EN | हिंदी</button>

        <a href="../index.html">
            Home
        </a>

        <a href="signup.html" class="btn">
            Sign Up
        </a>

    </div>

</header>


<main class="auth-page">

    <div class="auth-card">

        <div class="auth-header">

            <h1>Welcome Back</h1>

            <p>
                Login to continue using AgriHire
            </p>

        </div>


        <form>

            <div class="form-group">

                <label>
                    Email or Mobile Number
                </label>

                <input
                    type="text"
                    placeholder="Enter email or mobile number"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <div class="form-options">

                <label>
                    <input type="checkbox">
                    Remember me
                </label>

                <a href="#">
                    Forgot Password?
                </a>

            </div>


            <button
                type="submit"
                class="btn full-width"
            >
                Login
            </button>

        </form>


        <div class="auth-divider">
            OR
        </div>


        <p class="auth-footer">

            Don't have an account?

            <a href="signup.html">
                Create Account
            </a>

        </p>

    </div>

</main>

</body>
</html>
