<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Post Requirement | AgriHire</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

<header class="navbar">

    <a href="../index.html" class="logo">
        🚜 AgriHire
    </a>

    <a href="farmer-dashboard.html">
        ← Dashboard
    </a>

</header>


<main class="form-page">

    <div class="form-container">

        <h1>
            What Equipment Do You Need?
        </h1>

        <p>
            Tell equipment owners what you need
            and receive suitable rental options.
        </p>


        <form>


            <div class="form-group">

                <label>
                    Farming Activity
                </label>

                <select>

                    <option>
                        Select Activity
                    </option>

                    <option>
                        Land Preparation
                    </option>

                    <option>
                        Sowing
                    </option>

                    <option>
                        Irrigation
                    </option>

                    <option>
                        Spraying
                    </option>

                    <option>
                        Harvesting
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Equipment Required
                </label>

                <select>

                    <option>
                        Select Equipment
                    </option>

                    <option>Tractor</option>
                    <option>Harrow</option>
                    <option>Cultivator</option>
                    <option>Rotavator</option>
                    <option>Seed Drill</option>
                    <option>Plough</option>
                    <option>Digger</option>
                    <option>Harvester</option>

                </select>

            </div>


            <div class="form-group">

                <label>
                    Farm Area
                </label>

                <input
                    type="number"
                    placeholder="Area in acres"
                >

            </div>


            <div class="form-group">

                <label>
                    Location
                </label>

                <input
                    type="text"
                    placeholder="Village / City / District"
                >

            </div>


            <div class="form-row">

                <div class="form-group">

                    <label>
                        Required From
                    </label>

                    <input type="date">

                </div>


                <div class="form-group">

                    <label>
                        Required Until
                    </label>

                    <input type="date">

                </div>

            </div>


            <div class="form-group">

                <label>
                    Additional Requirements
                </label>

                <textarea
                    rows="5"
                    placeholder="Any specific requirements..."
                ></textarea>

            </div>


            <button
                type="submit"
                class="btn"
            >
                Post Requirement
            </button>

        </form>

    </div>

</main>

</body>
</html>
