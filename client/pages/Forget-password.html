<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | AgriHire</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/forgot-password.js" defer></script>
</head>
<body>

<header class="navbar">
    <a href="../index.html" class="logo">🚜 AgriHire</a>
    <div class="nav-actions">
        <a href="login.html">Back to Login</a>
    </div>
</header>

<main class="auth-page">
    <div class="auth-card">
        <div class="auth-header">
            <h1>Reset Password</h1>
            <p>Enter your registered details to set a new password.</p>
        </div>

        <form id="resetPasswordForm">
            <div class="form-group">
                <label for="email">Registered Email</label>
                <input
                    type="email"
                    id="email"
                    required
                    placeholder="Enter your registered email"
                    autocomplete="email"
                >
            </div>

            <div class="form-group">
                <label for="mobile">Registered Mobile Number</label>
                <input
                    type="tel"
                    id="mobile"
                    required
                    maxlength="10"
                    pattern="[0-9]{10}"
                    inputmode="numeric"
                    placeholder="10-digit mobile number"
                >
            </div>

            <div class="form-group">
                <label for="newPassword">New Password</label>
                <input
                    type="password"
                    id="newPassword"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="At least 8 characters"
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm New Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    required
                    minlength="8"
                    autocomplete="new-password"
                    placeholder="Enter password again"
                >
            </div>

            <p id="resetMessage" role="status" aria-live="polite"></p>

            <button type="submit" class="btn full-width">
                Reset Password
            </button>
        </form>

        <p class="auth-footer">
            Remember your password?
            <a href="login.html">Login</a>
        </p>
    </div>
</main>

</body>
</html>
