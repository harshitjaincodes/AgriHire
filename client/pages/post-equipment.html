
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Equipment | AgriHire</title>
    <link rel="stylesheet" href="../css/style.css">
    <script src="../js/post-equipment.js" defer></script>
</head>
<body>

<header class="navbar">
    <a href="../index.html" class="logo">🚜 AgriHire</a>
    <a href="owner-dashboard.html">← Owner Dashboard</a>
</header>

<main class="form-page">
    <div class="form-container">

        <h1>List Your Equipment</h1>
        <p>Rent out your agricultural equipment to farmers nearby.</p>

        <form id="equipmentForm" enctype="multipart/form-data">

            <div class="form-group">
                <label for="category">Equipment Category</label>
                <select id="category" name="category" required>
                    <option value="">Select Category</option>
                    <option>Tractor</option>
                    <option>Harrow</option>
                    <option>Cultivator</option>
                    <option>Rotavator</option>
                    <option>Seed Drill</option>
                    <option>Plough</option>
                    <option>Bund Former</option>
                    <option>Digger</option>
                    <option>Sprayer</option>
                    <option>Thresher</option>
                    <option>Harvester</option>
                </select>
            </div>

            <div class="form-group">
                <label for="equipmentName">Equipment Name</label>
                <input type="text" id="equipmentName" name="equipmentName"
                    placeholder="e.g. John Deere 5310" maxlength="100" required>
            </div>

            <div class="form-group">
                <label for="model">Model</label>
                <input type="text" id="model" name="model"
                    placeholder="Model number" maxlength="100">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="5"
                    maxlength="2000" placeholder="Describe your equipment..."></textarea>
            </div>

            <div class="form-group">
                <label for="location">Location</label>
                <input type="text" id="location" name="location"
                    placeholder="Village / City / District" maxlength="150" required>
            </div>

            <h2>Rental Pricing</h2>

            <div class="form-row">
                <div class="form-group">
                    <label for="hourlyPrice">Hourly Price (₹)</label>
                    <input type="number" id="hourlyPrice" name="hourlyPrice"
                        placeholder="₹ per hour" min="0" step="0.01">
                </div>

                <div class="form-group">
                    <label for="dailyPrice">Daily Price (₹)</label>
                    <input type="number" id="dailyPrice" name="dailyPrice"
                        placeholder="₹ per day" min="0" step="0.01">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="weeklyPrice">Weekly Price (₹)</label>
                    <input type="number" id="weeklyPrice" name="weeklyPrice"
                        placeholder="₹ per week" min="0" step="0.01">
                </div>

                <div class="form-group">
                    <label for="tenDayPrice">10-Day Package (₹)</label>
                    <input type="number" id="tenDayPrice" name="tenDayPrice"
                        placeholder="₹" min="0" step="0.01">
                </div>
            </div>

            <div class="form-group">
                <label for="specialOffer">Special Offer</label>
                <input type="text" id="specialOffer" name="specialOffer"
                    placeholder="e.g. 10L Diesel Free" maxlength="200">
            </div>

            <div class="form-group">
    <label for="equipmentImage">Equipment Image</label>
    <input
        type="file"
        id="equipmentImage"
        name="equipmentImage"
        accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
    >
    <small>Upload a JPG, PNG, or WebP image (maximum 5 MB).</small>
</div>
            <p id="equipmentMessage" role="status" aria-live="polite"></p>

            <button type="submit" class="btn" id="publishButton">
                Publish Equipment
            </button>

        </form>
    </div>
</main>

</body>
</html>
